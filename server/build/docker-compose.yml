services:
  postgres:
    extends:
        file: docker-compose.common.yml
        service: postgres
    tmpfs: /var/lib/postgresql/data
  minio:
    extends:
        file: docker-compose.common.yml
        service: minio
  azurite:
    extends:
        file: docker-compose.common.yml
        service: azurite
  inbucket:
    extends:
        file: docker-compose.common.yml
        service: inbucket
  openldap:
    extends:
        file: docker-compose.common.yml
        service: openldap
  elasticsearch:
    extends:
        file: docker-compose.common.yml
        service: elasticsearch
  opensearch:
    extends:
        file: docker-compose.common.yml
        service: opensearch
  redis:
    extends:
        file: docker-compose.common.yml
        service: redis
  dejavu:
    extends:
        file: docker-compose.common.yml
        service: dejavu
  keycloak:
    extends:
        file: docker-compose.common.yml
        service: keycloak
  prometheus:
    extends:
        file: docker-compose.common.yml
        service: prometheus
  grafana:
    extends:
        file: docker-compose.common.yml
        service: grafana
  loki:
    extends:
        file: docker-compose.common.yml
        service: loki
  otel-collector:
    extends:
        file: docker-compose.common.yml
        service: otel-collector

  start_dependencies:
    # The old mattermost/mattermost-wait-for-dep image is not pullable on this
    # fork's CI (the compose step exits in about a second). Busybox from ECR
    # Public is the same TCP wait.
    image: public.ecr.aws/docker/library/busybox:1.36
    networks:
      - mm-test
    depends_on:
      - postgres
      - minio
      - azurite
      - inbucket
      - openldap
      - elasticsearch
      - opensearch
      - redis
    command:
      - sh
      - -c
      - |
        set -eu
        for target in postgres:5432 minio:9000 azurite:10000 inbucket:9001 openldap:389 elasticsearch:9200 opensearch:9201 redis:6379; do
          host=$${target%%:*}
          port=$${target##*:}
          echo "waiting for $$host:$$port"
          i=0
          until nc -z "$$host" "$$port"; do
            i=$$((i+1))
            if [ "$$i" -gt 90 ]; then
              echo "timed out waiting for $$host:$$port"
              exit 1
            fi
            sleep 2
          done
        done

networks:
  mm-test:
    driver: bridge
