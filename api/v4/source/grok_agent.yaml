  /api/v4/grok_agent/status:
    get:
      tags:
        - agents
        - ai
      summary: Get Grok workspace agent status
      description: >
        Return whether the built-in Mattermost workspace agent is available
        and which LLM provider it will use. Grok Chat is used when the
        `YvetteGrokAPI` environment secret is set; otherwise answers are
        grounded in workspace history.

        ##### Permissions

        Must be authenticated.

        __Minimum server version__: 11.2
      operationId: GetGrokAgentStatus
      responses:
        "200":
          description: Status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrokAgentStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v4/grok_agent/query:
    post:
      tags:
        - agents
        - ai
      summary: Query the Grok workspace agent
      description: >
        Ask the built-in Slackbot-class workspace agent a question or trigger
        an action. The agent reads recent Mattermost channel or thread history
        and, when relevant, GitHub (`yvettejade/mattermost`) and Jira (`YJIRA`)
        context. Supported intents: `ask`, `summarize`, `draft`, `schedule`,
        `canvas`, `route`, `github`, and `jira`.

        When `YvetteGrokAPI` is set, completions are generated by Grok Chat.

        ##### Permissions

        Must be authenticated. User must have `read_channel` on the requested channel.

        __Minimum server version__: 11.2
      operationId: QueryGrokAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrokAgentQueryRequest"
      responses:
        "200":
          description: Agent reply generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrokAgentQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
