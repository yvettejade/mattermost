name: QA Bugbot

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to run QA Bugbot on
        required: true
        type: string

concurrency:
  group: qa-bugbot-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  qa-bugbot:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: .agents/qa-bugbot

    env:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      REPO_URL: https://github.com/${{ github.repository }}
      STARTING_REF: ${{ github.event.pull_request.base.ref || 'master' }}
      TARGET_PR_URL: ${{ github.event.pull_request.html_url || format('https://github.com/{0}/pull/{1}', github.repository, github.event.inputs.pr_number) }}
      MODEL_ID: composer-2.5
      MAX_QA_ITERATIONS: "3"
      POST_PR_COMMENT: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check CURSOR_API_KEY
        id: prereq
        working-directory: .
        run: |
          if [ -z "${CURSOR_API_KEY}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CURSOR_API_KEY not configured; skipping QA Bugbot"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.prereq.outputs.enabled == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .agents/qa-bugbot/package-lock.json

      - name: Install dependencies
        if: steps.prereq.outputs.enabled == 'true'
        run: npm ci

      - name: Run QA Bugbot chain
        if: steps.prereq.outputs.enabled == 'true'
        run: npm start

      - name: Post QA summary comment
        if: always() && steps.prereq.outputs.enabled == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SESSION=$(ls -t runs/session-*.json 2>/dev/null | head -1 || true)
          if [ -z "$SESSION" ]; then
            echo "No session log found; skipping PR comment"
            exit 0
          fi
          BODY=$(node -e "
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync(process.argv[1], 'utf8'));
            const step = (s.steps || []).find((x) => x.label === '4-Summary');
            const text = step?.finalText || '';
            if (!text) process.exit(0);
            const max = 60000;
            process.stdout.write(text.length > max ? text.slice(0, max) + '\n\n…(truncated)' : text);
          " "$SESSION")
          if [ -z "$BODY" ]; then
            echo "No summary text in session; skipping PR comment"
            exit 0
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"

      - name: Upload session log
        if: always() && steps.prereq.outputs.enabled == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: qa-bugbot-session-${{ github.run_id }}
          path: .agents/qa-bugbot/runs/
          if-no-files-found: ignore
